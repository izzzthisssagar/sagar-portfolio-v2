services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sagar_portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '5432:5432'
    volumes:
      - portfolio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d sagar_portfolio']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio-postgres:
